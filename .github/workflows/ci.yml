name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev --extra hf
      - run: uv run ruff check src tests jobs/run_hf_eval.py jobs/run_model_issue_stages.py
      - run: uv run mypy --ignore-missing-imports src/decision_bench jobs/run_hf_eval.py
      - run: uv run pytest
