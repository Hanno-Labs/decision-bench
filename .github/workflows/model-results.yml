name: Model issue benchmark results

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'Hanno-Labs/decision-bench' &&
      startsWith(github.event.pull_request.head.ref, 'codex/model-issue-')
    runs-on: ubuntu-latest
    concurrency:
      group: model-results-launch-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out reviewed adapter merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: python -m pip install 'huggingface_hub==1.32.0'

      - name: Launch pinned full benchmark
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::The HF_TOKEN Actions secret is required to launch and sync HF Jobs'
            exit 1
          fi
          python jobs/model_results.py launch

  finalize:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: model-results-finalize
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - name: Check out DecisionBench
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Hugging Face CLI
        run: python -m pip install 'huggingface_hub==1.32.0'

      - name: Find completed benchmark jobs
        id: ready
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python jobs/model_results.py ready

      - name: Exchange results PR credential
        if: steps.ready.outputs.has_results == 'true'
        id: octo-sts
        uses: octo-sts/action@b6a4c9287012d2e1d2477d4f25d6f35de668e2d3
        with:
          scope: Hanno-Labs/decision-bench-results
          identity: decisionbench-model-results

      - name: Finalize completed benchmarks
        if: steps.ready.outputs.has_results == 'true'
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          RESULTS_GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::The HF_TOKEN Actions secret is required to read benchmark artifacts'
            exit 1
          fi
          python jobs/model_results.py finalize
