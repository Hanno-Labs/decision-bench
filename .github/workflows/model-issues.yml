name: Model issue intake

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  prepare-adapter:
    if: >-
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'model') &&
      contains(fromJSON('["CONTRIBUTOR","MEMBER","OWNER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    concurrency:
      group: model-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Check out DecisionBench
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Pi coding agent
        run: npm install --global @earendil-works/pi-coding-agent@0.87.1

      - name: Install guarded GitHub channel
        run: >-
          pip install
          'git+https://github.com/Clause-Logic/exoclaw-plugins.git@cabbd1ea7fc953bc62cde826b94c01d2227ff022#subdirectory=packages/exoclaw-github'

      - name: Research model and prepare adapter
        run: python jobs/run_model_issue_stages.py
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Refresh dependency lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- pyproject.toml; then
            uv lock
          fi

      - name: Check generated adapter
        run: |
          uv run ruff check src tests jobs/run_hf_eval.py jobs/model_handoff.py jobs/model_results.py jobs/run_model_issue_stages.py
          uv run pytest -q

      - name: Limit generated changes
        id: changes
        shell: bash
        run: |
          git add -A
          while IFS= read -r -d '' path; do
            case "$path" in
              src/decision_bench/*|jobs/*|docs/overview/models.md|docs/contributing/adding_a_model.md|tests/*|pyproject.toml|uv.lock) ;;
              *) echo "::error::Disallowed generated path: $path"; exit 1 ;;
            esac
            if [ -L "$path" ]; then
              echo "::error::Generated symlinks are disallowed: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only -z)
          if git diff --cached --quiet; then
            echo '::error::Model agent produced no adapter changes'
            exit 1
          fi
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

      - name: Save reviewed patch for the PR job
        shell: bash
        run: git diff --cached --binary > "$RUNNER_TEMP/model-issue.patch"

      - name: Upload reviewed patch
        uses: actions/upload-artifact@v4
        with:
          name: model-issue-patch
          path: ${{ runner.temp }}/model-issue.patch
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: prepare-adapter
    if: needs.prepare-adapter.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out trusted base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download reviewed patch
        uses: actions/download-artifact@v4
        with:
          name: model-issue-patch
          path: ${{ runner.temp }}/model-issue-patch

      - name: Apply reviewed patch without executing generated code
        shell: bash
        run: |
          git apply --check "$RUNNER_TEMP/model-issue-patch/model-issue.patch"
          git apply "$RUNNER_TEMP/model-issue-patch/model-issue.patch"
          git add -A
          while IFS= read -r -d '' path; do
            case "$path" in
              src/decision_bench/*|jobs/*|docs/overview/models.md|docs/contributing/adding_a_model.md|tests/*|pyproject.toml|uv.lock) ;;
              *) echo "::error::Disallowed generated path: $path"; exit 1 ;;
            esac
            if [ -L "$path" ]; then
              echo "::error::Generated symlinks are disallowed: $path"
              exit 1
            fi
          done < <(git diff --cached --name-only -z)

      - name: Exchange PR credential
        id: octo-sts
        uses: octo-sts/action@b6a4c9287012d2e1d2477d4f25d6f35de668e2d3
        with:
          scope: Hanno-Labs/decision-bench
          identity: decisionbench-model-issues

      - name: Open adapter PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="codex/model-issue-${ISSUE_NUMBER}"
          existing_pr=$(gh pr list --repo Hanno-Labs/decision-bench --state all --head "$branch" --json number --jq '.[0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "Adapter PR already exists for issue #${ISSUE_NUMBER}"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            echo "Reusing the existing adapter branch for issue #${ISSUE_NUMBER}"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c core.hooksPath=/dev/null commit -m "Add model adapter from issue #${ISSUE_NUMBER}"
            gh auth setup-git
            git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/${branch}"
          fi
          cat > "$RUNNER_TEMP/model-pr-body.md" <<EOF
          Implements the model request in #${ISSUE_NUMBER}.

          Generated adapter changes require review and CI. A full benchmark and a results PR follow the approved adapter revision.
          EOF
          gh pr create --base main --head "$branch" \
            --title "Add model adapter from issue #${ISSUE_NUMBER}" \
            --body-file "$RUNNER_TEMP/model-pr-body.md"
