[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decision-bench"
version = "0.1.0"
description = "An open benchmark for decision models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "datasets>=4.0,<5",
  "httpx[http2]>=0.28,<1",
  "pyarrow>=21,<22",
  "pydantic>=2.11,<3",
  "transformers>=5.17,<6",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
hf = [
  "peft>=0.17,<1",
  "safetensors>=0.6,<1",
  "torch>=2.8,<3",
]
mojev = [
  "mojev[transformers] @ git+https://github.com/MoLeMo-Lab/mojev.git@a74d58cd19ec573e83e8e27f9fecd837b8d830fb",
]
gguf = [
  "fastapi>=0.116,<1",
  "llama-cpp-python>=0.3,<1",
  "uvicorn>=0.35,<1",
]
leaderboard = [
  "gradio>=5.49,<7",
  "pandas>=2.3,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]
docs = [
  "mkdocstrings-python>=1.18,<2",
  "zensical==0.0.57",
]

[project.scripts]
decision-bench = "decision_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_bench"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
